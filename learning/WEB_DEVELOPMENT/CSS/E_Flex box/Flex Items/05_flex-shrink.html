<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-shrink</title>
    <style>
        .container{
            background-color: beige;
            padding: 0;
            margin: 50px;
            border: 3px solid #000;

            display: flex;
            flex-direction: row;
        }

        .items{
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 0;
            margin: 0;
            height: 60px;
            width: 300px;
        }

        .one{background-color: orangered; flex-shrink: 0;}
        .two{background-color: yellowgreen; flex-shrink: 3;}
        .three{background-color: mediumpurple; flex-shrink: 2;}
        .four{background-color: hotpink; flex-shrink: 1;}


    </style>
</head>
<body>
    <!-- 1 is the default value of flex-shrink that is it can shrink -->
    <div class="container">
        <div class="one items">One</div>
        <div class="two items">Two</div>
        <div class="three items">Three</div>
        <div class="four items">Four</div>
    </div>
</body>
</html>
