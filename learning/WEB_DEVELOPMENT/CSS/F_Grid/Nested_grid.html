<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested grid</title>
    <style>

        .container{
            background-color: lightgrey;
            width: 650px;
            margin: 50px auto 0;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 150px);
            gap: 10px;
        }



        .item1{
            background-color: coral;
        }
        .item2{
            background-color: hotpink;
        }
        .item3{
            background-color: rgb(211, 243, 93);
            display: grid;

            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }

        .item3 > div{
            background-color: white;
            color: red;
            padding: 10px;
        }
        .item4{
            background-color: rgb(199, 97, 230);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item1">One</div>
        <div class="items item2">Two</div>
        <div class="items item3">
            <div class="subitems subitem1">A</div>
            <div class="subitems subitem2">B</div>
            <div class="subitems subitem3">C</div>
        </div>
        <div class="items item4">Four</div>
    </div>
</body>
</html>
