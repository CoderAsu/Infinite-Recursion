<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-stroke</title>
    <style>
        .text {
            font-size: 4em;
            -webkit-text-stroke-width: 2px;
            -webkit-text-stroke-color: rgb(214, 17, 17);
            -webkit-text-fill-color: transparent;
        }
        .text2 {
            font-size: 4em;
            -webkit-text-stroke: 2px blue;
            -webkit-text-fill-color: yellow;
        }
        .text3 {
            font-size: 4em;
            -webkit-text-stroke: 2px rgb(215, 20, 229);
            -webkit-text-fill-color: rgb(24, 229, 24);
        }
    </style>
</head>
<body>
    <h1 class="text">Text Stroke</h1>
    <h1 class="text2">Text Stroke 2</h1>
    <h1 class="text3">Text Stroke 3</h1>
</body>
</html>
