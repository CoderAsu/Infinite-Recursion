<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@prefer-color-scheme</title>
    <style>
        @media (prefers-color-scheme: dark){
            body{
                background-color: red;
                color: white;
            }
        }

        @media (prefers-color-scheme: light){
            body{
                background-color: lightpink;
                color: black;
            }
        }
    </style>
</head>
<body>
    <h1>@media (prefers-color-scheme)</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Hic eveniet, nisi amet doloremque ex molestias non quidem sint, est officiis dolores provident autem repudiandae recusandae voluptatum sit consectetur, laboriosam at.</p>
</body>
</html>
