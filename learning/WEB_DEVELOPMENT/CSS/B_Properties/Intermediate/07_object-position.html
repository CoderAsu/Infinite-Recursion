<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object-position</title>
    <style>

        div{
            height: 600px;
            width: 750px;
            border: 2px solid black;
        }

        .container img{
            height: 100%;
            width: 100%;
            object-fit: none;
            object-position: 80% 80%;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../Images/paris.jpg" alt="paris">
    </div>
</body>
</html>
