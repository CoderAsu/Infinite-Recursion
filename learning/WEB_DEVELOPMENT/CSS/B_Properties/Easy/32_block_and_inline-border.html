<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border-block and border-inline </title>
    <style>
        .box1{
            height: 200px;
            width: 200px;
            background-color: rgb(128, 187, 238);
            border-block: 2px solid red;
            writing-mode: vertical-lr;
        }

        .box2{
            height: 200px;
            width: 200px;
            background-color: rgb(125, 253, 204);
            border-block: 4px solid rgb(241, 13, 13);
        }

        .box3{
            height: 200px;
            width: 200px;
            background-color: rgb(92, 235, 245);
            border-inline: 4px solid red;
        }

    </style>
</head>
<body>
    <!-- Properties of border-block -->
     <!-- 
        1. border-block
        2. border-block-color
        3. border-block-style
        4. border-block-width
        5. border-block-start
        6. border-block-end
        7. border-block-start-color
        8. border-block-start-style
        9. border-block-start-width
        10. border-block-end-color
        11. border-block-end-style
        12. border-block-end-width
     -->

     <!-- Properties of border-inline -->
     <!-- 
        1. border-inline
        2. border-inline-color
        3. border-inline-style
        4. border-inline-width
        5. border-inline-start
        6. border-inline-end
        7. border-inline-start-color
        8. border-inline-start-style
        9. border-inline-start-width
        10. border-inline-end-color
        11. border-inline-end-style
        12. border-inline-end-width
     -->

    <h1>understanding border-block and border-inline</h1>
     <div class="box1">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Corrupti officia ipsum, vero itaque provident commodi, amet a perspiciatis explicabo, optio ratione! Officiis, minima placeat ipsa at alias qui illum rerum?</div> <br>

    <h1>border-block</h1>      
     <div class="box2"></div> <br>

     <h1>border-inline</h1>
     <div class="box3"></div>
</body>
</html>
