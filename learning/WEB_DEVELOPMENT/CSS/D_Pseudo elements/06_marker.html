<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::marker</title>
    <style>
        ul li::marker{
            color: red;
            font-size: x-large;
        }

        ol li::marker{
            color: blue;
            font-size: xx-large;
        }
    </style>
</head>
<body>
    <ul>
        <li>Orange</li>
        <li>Banana</li>
        <li>Apple</li>
        <li>Grapes</li>
    </ul>

    <br><br>

    <ol>
        <li>Potato</li>
        <li>Onion</li>
        <li>Brinjal</li>
        <li>Cabbage</li>
    </ol>

</body>
</html>
