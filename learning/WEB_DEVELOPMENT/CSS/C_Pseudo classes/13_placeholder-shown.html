<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:placeholder-shown</title>
    <style>
        input:placeholder-shown, textarea:placeholder-shown{
            border: 2px solid red;
            font-size: large;
        }
    </style>
</head>
<body>
    <form action="">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" placeholder="Enter your firstname"> <br> <br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" placeholder="Enter your lastname"> <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email"><br>


        <label for="textarea">Description: </label> <br>
        <textarea name="" id="textarea" placeholder="write some text"></textarea>

    </form>
</body>
</html>
