<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>targeting methods</title>
</head>
<body>
    <div id="container">
        <div class="child item1">Hulk</div>
        <div class="child item2">Ironman</div>
        <div class="child item3">Thor</div>
    </div>
    <div id="mydiv1">
        <div>Virat Kohli</div>
        <div>Rohit Sharma</div>
        <div>AB Devilliers</div>
    </div>
    <div id="mydiv2">Chris Gayle</div>
</body>
<script>


    // targeting methods for elements
    /* 
        1. getElementsByClassName()
        2. getElementsByTagName()
        3. querySelector()
        4. querySelectorAll()
    */



    let element = document.getElementById("container");

    console.log(element.getElementsByClassName("child"));

    console.log(element.getElementsByClassName("child").item(1));






    let element2 = document.getElementById("mydiv1");

    console.log(element2.getElementsByTagName("div"));

    console.log(element2.getElementsByTagName("div").item(2));




    console.log(element.querySelector("div :nth-child(2)"));


    console.log(element2.querySelectorAll("div"));
    console.log(element2.querySelectorAll("div").item(0));


</script>
</html>
