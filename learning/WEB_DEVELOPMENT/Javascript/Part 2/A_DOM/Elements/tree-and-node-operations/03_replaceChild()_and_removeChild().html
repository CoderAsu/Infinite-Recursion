<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>replaceChild() and removeChild()</title>
</head>
<body>
    <ul id="list">
        <li>Orange</li>
        <li>Apple</li>
        <li>Grapes</li>
        <li>Banana</li>
    </ul>
</body>
<script>
    let newElement = document.createElement("li");
    let newText = document.createTextNode("Hello World");
    newElement.appendChild(newText);

    let target = document.querySelector("#list");
    let oldElement = target.children[1];
    target.replaceChild(newElement, oldElement);





    let removeChild = target.children[3];
    target.removeChild(removeChild);

    
</script>
</html>
