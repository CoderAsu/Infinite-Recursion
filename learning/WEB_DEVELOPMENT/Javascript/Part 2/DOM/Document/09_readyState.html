<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>readyState</title>
</head>
<body>
    <h2>The readyState Property</h2>

    <p id="demo"></p>
</body>
<script>
    // The readyState property returns the (loading) status of the current document.

    /* 
        The status of the current document:
        1. uninitialized
        2. loading
        3. loaded
        4. interactive
        5. complete
    */


    document.getElementById("demo").innerHTML = document.readyState;
</script>
</html>
