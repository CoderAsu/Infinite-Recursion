<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>activeElement</title>
</head>
<body>
    <h2>The activeElement Property</h2>

    <input type="text" value="An input field">
    <button>A Button</button>

    <p>Click anywhere in the document to display the active element:</p>

    <p id="demo"></p>
</body>
<script>

    document.body.addEventListener("click", function myFunction() {
      const element = document.activeElement.tagName;
      document.getElementById("demo").innerHTML = element;
    })
    
</script>
</html>
