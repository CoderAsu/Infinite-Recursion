<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>addEventListener()</title>
    <style>
        .outer{
            height: 400px;
            width: 400px;
            border: 2px solid black;
            background-color: orange;
        }

        .inner{
            height: 150px;
            aspect-ratio: 1;
            border: 2px solid black;
            background-color: hotpink;
            position: relative;
            top: 120px;
            left: 120px;
        }
    </style>
</head>
<body>
    <button id="btn1">Click me</button>
    <br><br>
    <button id="btn2">Go</button>
    <br><br>

    <div class="outer">
        <div class="inner"></div>
    </div>
    <br>
    <a href="https://www.google.com">Google</a>
    <br><br>

    <button id="btn3">Submit</button>
</body>
<script>
    let button = document.getElementById("btn1");

    button.onclick = abc;

    function abc() {
        button.style.color = "red";
    }







    let button2 = document.getElementById("btn2");

    button2.addEventListener("click", function(){
        this.style.backgroundColor = "cyan";
    })

    button2.addEventListener("dblclick", bdr);

    function bdr(){
        this.style.border = "2px solid red";
    }
       
    






    document.querySelector(".inner").addEventListener('click', function(e){
        alert("Inner Div");
        e.stopPropagation();
    })


    document.querySelector(".outer").addEventListener('click', function(){
        alert("Outer Div");
    })



    document.querySelector("a").addEventListener('click', function(e){
        console.log("Google is clicked");
        e.preventDefault();
    })











    // removeEventListener()

    document.getElementById("btn3").addEventListener("mouseleave", run);

    document.getElementById("btn3").addEventListener("click", remove);

    function run(){
        document.getElementById("btn3").style.backgroundColor = "green";
    }

    function remove(){
        document.getElementById("btn3").removeEventListener("mouseleave", run);
    }
    
</script>
</html>
