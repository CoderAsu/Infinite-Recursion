<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form methods</title>
    <style>
        a:focus, a:active{
            color: red;
        }
    </style>
</head>
<body>
    <h2>The focus(), blur() and click() Methods</h2>

    <a id="myAnchor" href="https://www.google.com">Google</a>

    <p>Click the buttons to give or remove focus from the link above.</p>

    <input type="button" onclick="getfocus()" value="Get focus">
    <input type="button" onclick="losefocus()" value="Lose focus">

    <br><br>

    <p>Hover over the checkbox to simulate a mouse-click.</p>
    <form>
        <input type="checkbox" id="myCheck" onmouseover="myFunction()">
    </form>
</body>
<script>
    function getfocus() {
        document.getElementById("myAnchor").focus();
    }

    function losefocus() {
        document.getElementById("myAnchor").blur();
    }

    /* 
    
    The focus() method gives focus to an element (if it can be focused).
    The blur() method removes focus from an element.
    
    */




    function myFunction() {
        document.getElementById("myCheck").click();
    }


   /* The click() method simulates a mouse-click on an element. */
</script>
</html>
