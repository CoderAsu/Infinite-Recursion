    <title>counting methods</title>
</head>
<body>
    
</body>
<script>


/*
    console.count() -> Count how many times a label is reached

    console.countReset() -> Reset a labeled counter
*/


    console.count("Login");
    console.count("Login");
    console.count("Signup");
    console.count("Login");




    console.count("Visit");      
    console.count("Visit");      
    console.countReset("Visit");
    console.count("Visit");      

</script>
