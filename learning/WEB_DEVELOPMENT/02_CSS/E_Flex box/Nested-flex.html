<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nested-flex</title>
    <style>
        .container{
            background-color: lightgrey;
            margin: 50px;
            padding: 0px;
            border: 3px solid black;
        }

        .items{         
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 0px;
            height: 100px;

            display: flex;
            flex-direction: column;
        }

        .item1{
            background-color: orangered;
        }
        .item2{
            background-color: mediumpurple;
            display: flex;
            flex-direction: row;
        }

        .item2 > .subitems{
            background-color: wheat;
            color: mediumpurple;
            flex-grow: 1;
            margin: 5px;
        }

        .item3{
            background-color: hotpink;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="items item1">One</div>
        <div class="items item2">
            <div class="subitems subitem1">A</div>
            <div class="subitems subitem2">B</div>
            <div class="subitems subitem3">C</div>
        </div>
        <div class="items item3">Three</div>
    </div>
</body>
</html>
