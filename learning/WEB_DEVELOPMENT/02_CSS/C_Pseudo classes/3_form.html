<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        input:focus{
            border: 4px solid blue;
        }

        input:checked + label{
            box-shadow: 0px 0px 3px 4px red;
        }

        input:enabled{
            background-color: lightcyan;
        }

        input:disabled{
            border: 2px solid red;
        }

        input:required{
            font-size: 10px;
        }

        input:optional{
            font-size: 20px;
        }

        input:in-range{
            color: green;
        }

        input:out-of-range{
            background-color: lightpink;
        }

        input:read-only{
            color: rgb(241, 22, 187);
        }

        input:read-write{
            color: crimson;
        }

        input:invalid{
            background-color: lightskyblue;
        }

        input:valid{
            background-color: lightgreen;
        }

        input:default{
            box-shadow: 0 0 6px 4px gold;
            color: crimson;
        }

        option:default{
            color: red;
        }
    </style>
</head>
<body>
    <div>
        <form action="">
            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname" required><br> <br>
            <label for="mname">Middle name:</label>
            <input type="text" id="mname" name="mname" readonly value="kumar"><br> <br>
            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname" disabled><br> <br>

            <label for="email">Enter your email:</label>
            <input type="email" id="email" name="email" placeholder="example123@gmail.com" required> <br><br> 

            <label for="quantity">Quantity (between 1 and 5):</label>
            <input type="number" id="quantity" name="quantity" min="1" max="10"> <br><br>

            <input type="radio" id="html" name="fav_language" value="HTML">
            <label for="html">HTML</label><br>
            <input type="radio" id="css" name="fav_language" value="CSS" checked>
            <label for="css">CSS</label><br>
            <input type="radio" id="javascript" name="fav_language" value="JavaScript">
            <label for="javascript">JavaScript</label> <br><br>

            <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
            <label for="vehicle1"> I have a bike</label><br>
            <input type="checkbox" id="vehicle2" name="vehicle2" value="Car" checked >
            <label for="vehicle2"> I have a car</label><br>
            <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
            <label for="vehicle3"> I have a boat</label> <br><br>

            <label for="cars">Choose a car:</label>
            <select id="cars" name="cars">
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="fiat" selected>Fiat</option>
            <option value="audi">Audi</option>
            </select> <br><br>

            <input type="submit">
        </form>
    </div>
</body>
</html>
