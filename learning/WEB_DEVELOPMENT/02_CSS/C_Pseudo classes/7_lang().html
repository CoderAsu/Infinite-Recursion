<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:lang()</title>
    <style>
        p:lang(en){
            color: red;
        }

        p:lang(de){
            background-color: aquamarine;
        }

        p:lang(fr){
            font-size: 30px;
        }
    </style>
</head>
<body>
    <p lang="en">Hello welcome to our website</p>
    <p lang="fr">Bonjour sur notre site</p>
    <p lang="de">Hello willkommen auf unserer website</p>
</body>
</html>
