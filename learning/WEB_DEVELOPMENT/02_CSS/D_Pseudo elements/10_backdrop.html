<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::backdrop Example</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        /* Backdrop for modal */
        dialog::backdrop {
            background: rgba(194, 48, 48, 0.6);
        }

        /* Backdrop for fullscreen */
        #fullscreenElement::backdrop {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.3));
        }

        /* Backdrop for popovers */
        #myPopover::backdrop {
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Modal Dialog -->
    <dialog id="myDialog">
        <p>This is a modal dialog with a styled backdrop.</p>
        <button onclick="closeDialog()">Close</button>
    </dialog>
    <button onclick="openDialog()">Open Modal</button>

    <!-- Fullscreen Element -->
    <div id="fullscreenElement">
        <p>Click the button to enter fullscreen.</p>
        <button onclick="enterFullscreen()">Go Fullscreen</button>
    </div>

    <!-- Popover -->
    <button popovertarget="myPopover">Open Popover</button>
    <div id="myPopover" popover>
        <p>This is a popover with a blurred backdrop.</p>
        <button onclick="closePopover()">Close</button>
    </div>

    <script>
        // Modal Dialog Functions
        function openDialog() {
            document.getElementById("myDialog").showModal();
        }

        function closeDialog() {
            document.getElementById("myDialog").close();
        }

        // Fullscreen Functions
        function enterFullscreen() {
            const elem = document.getElementById("fullscreenElement");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            }
        }

        // Popover Functions
        function closePopover() {
            document.getElementById("myPopover").hidePopover();
        }
    </script>
</body>
</html>
