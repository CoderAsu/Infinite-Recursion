<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-underline-offset</title>
    <style>
        div.a {
            text-decoration: underline;
          }
          
          div.b {
            text-decoration: underline;
            text-underline-offset: 10px;
          }
          
          div.c {
            text-decoration: underline wavy blue;
          }
          
          div.d {
            text-decoration: underline wavy blue;
            text-underline-offset: 10px;  
          } 
    </style>
</head>
<body>
    <div class="a">This is some text with an underline.</div>

    <br>
    
    <div class="b">This is some text with an underline.</div>

    <br>

    <div class="c">This is some text with an underline.</div>

    <br>

    <div class="d">This is some text with an underline.</div>

</body>
</html>
