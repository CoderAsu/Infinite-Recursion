<!DOCTYPE html>
<html>
<head>
<style>
    img {
        display: inline-block;
        margin: 100px;
        -webkit-box-reflect: below;
    }

    .lion {
        -webkit-box-reflect: below 10px linear-gradient(to bottom, rgba(0,0,0,0.0), rgba(0,0,0,0.4));
        margin: 100px;
    }


    /* values of -webkit-box-reflect:
        1. below
        2. above
        3. left
        4. right
        5. none
    */
</style>
</head>
<body>

    <h1>CSS Box-Reflect</h1>

    <p>Show the reflection below the image:</p>
    <img src="images/image.png" width="200" height="358">


    <img class="lion" src="images/lion.jpg" alt="lion">

    <img class="paris" src="images/paris.jpg" alt="paris">


</body>
</html>
