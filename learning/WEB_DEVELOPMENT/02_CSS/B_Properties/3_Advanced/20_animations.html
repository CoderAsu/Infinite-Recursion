<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>

        .container{
            background-color: rgb(22, 252, 72);
            height: 50vh;
            width: 65vw;
        }

        .a{
            border: 1px solid black;
            background-color: rgb(255, 12, 194);
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

            animation-name: asuAnime;
            animation-delay: 1s;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
            animation-timing-function: ease;
            animation-fill-mode: both;
            animation-play-state: running;
            
            &:hover{
                animation-play-state: paused;
            }
        }

        /* shorthand of animation */
        .container2{
            background-color: rgb(247, 229, 193);
            height: 50vh;
            width: 65vw;
        }

        .b{
            border: 1px solid black;
            background-color: rgb(255, 12, 194);
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;

            /* animation: name duration timing-function delay iteration-count direction fill-mode; */

            animation: asuAnime 3s steps(3, start) 0.7s 4 alternate both ;
            
        }

        @keyframes asuAnime{
            from {background-color: rgb(7, 31, 245);
            }
            to {background-color: rgb(255, 0, 13);
                transform: translateX(500px);
            }
        }


        @keyframes sample {
            0%{background-color: yellow; width: 250px;}
            50%{background-color: green; width: 350px;}
            100%{background-color: red; width: 450px;}
        }

        .container3{
            width: 150px;
            height: 150px;
            background-color: chartreuse;
            margin-left: 20px;
            animation: sample 2s 1s 4 alternate none;
            &:hover{
                animation-play-state: paused;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <button class="a">Hello</button>
    </div>
    <br><br>
    <div class="container2">
        <button class="b">Welcome</button>
    </div> <br><br>

    <div class="container3">

    </div>

    <!-- Values of animation-direction -->
     <!-- 
        The animation-direction property can have the following values:

        1. normal - The animation is played as normal (forwards). This is default
        2. reverse - The animation is played in reverse direction (backwards)
        3. alternate - The animation is played forwards first, then backwards
        4. alternate-reverse - The animation is played backwards first, then forwards 
    -->



    <!-- Values of animation-timing-function -->
     <!-- 
        The animation-timing-function property can have the following values:

        1. ease - Specifies an animation with a slow start, then fast, then end slowly (this is default)
        2. linear - Specifies an animation with the same speed from start to end
        3. ease-in - Specifies an animation with a slow start
        4. ease-out - Specifies an animation with a slow end
        5. ease-in-out - Specifies an animation with a slow start and end
        6. setp-start - Specifies an animation with a single step from start
        7. step-end - Specifies an animation with a single step to end
        8. steps() - Specifies an animation with a single step from start to end
        9. cubic-bezier(n,n,n,n) - Lets you define your own values in a cubic-bezier function
     -->



     <!-- Values of animation-fill-mode -->
      <!-- 
        The animation-fill-mode property can have the following values:

        1. none - Default value. Animation will not apply any styles to the element before or after it is executing
        2. forwards - The element will retain the style values that is set by the last keyframe (depends on animation-direction and animation-iteration-count)
        3. backwards - The element will get the style values that is set by the first keyframe (depends on animation-direction), and retain this during the animation-delay period
        4. both - The animation will follow the rules for both forwards and backwards, extending the animation properties in both directions 
      -->
</body>
</html>
