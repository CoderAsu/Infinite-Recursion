<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter</title>
    <style>
        .none{
            filter: none;
        }

        .blur{
            filter: blur(5px);
        }

        .brightness{
            filter: brightness(1.5);
        }

        .contrast{
            filter: contrast(1.5);
        }

        .drop-shadow{
            filter: drop-shadow(5px 5px 5px #000);
        }

        .grayscale{
            filter: grayscale(80%);
        }

        .hue-rotate{
            filter: hue-rotate(90deg);
        }

        .invert{
            filter: invert(100%);
        }

        .opacity{
            filter: opacity(40%);
        }

        .saturate{
            filter: saturate(2);
        }

        .sepia{
            filter: sepia(100%);
        }

        .url{
            filter: url(#filter); /* SVG filter */
        }
    </style>
</head>
<body>

    <h1>none</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="none">
    <br><br>

    <h1>blur</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="blur">
    <br><br>

    <h1>brightness</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="brightness">
    <br><br>

    <h1>contrast</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="contrast">
    <br><br>

    <h1>drop-shadow</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="drop-shadow">
    <br><br>

    <h1>grayscale</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="grayscale">
    <br><br>

    <h1>hue-rotate</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="hue-rotate">
    <br><br>

    <h1>invert</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="invert">
    <br><br>

    <h1>opacity</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="opacity">
    <br><br>

    <h1>saturate</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="saturate">
    <br><br>

    <h1>sepia</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="sepia">
    <br><br>

    <h1>url</h1>
    <img src="../Images/mercedes.jpg" style="width: 300px; height: 200px;" class="url">
    
</body>
</html>
