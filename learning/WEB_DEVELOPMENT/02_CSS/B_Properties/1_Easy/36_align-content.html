<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>align-content</title>
    <style>
        .container{
            height: 600px;
            width: 400px;
            background-color: bisque;
            align-content: center;
        }

        .container>div{
            height: 100px;
            width: 100px;
            background-color: aqua;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>div1</div>
        <div>div2</div>
    </div>
</body>
</html>
