<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opacity</title>
    <style>
        #box1{
            width: 800px;
            height: 200px;
            padding: 30px;
            border: 3px solid black;
            background-color: tomato;
            opacity: 0.4;
        }
        /* when we decrease the value of opacity, the opacity increases. It's value ranges from 0 to 1. */
    </style>
</head>
<body>
    <div id="box1">
        <img src="images/img4.jpg" width="200px">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Pariatur, ea sint molestias commodi consequuntur aliquam quibusdam non nemo, in a perspiciatis dolore deleniti aliquid eius.
    </div>
</body>
</html>
