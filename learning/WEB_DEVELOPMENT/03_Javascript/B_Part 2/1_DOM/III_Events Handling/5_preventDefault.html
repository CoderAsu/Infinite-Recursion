<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>preventDefault()</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem}button,input{font:inherit;padding:.45rem .7rem;margin:.25rem}pre{padding:.75rem;background:#f4f4f4;white-space:pre-wrap}</style>
</head>
<body>
<h1>preventDefault()</h1><p>Some events have a default browser action. For example, clicking a link navigates to its address. Call event.preventDefault() to cancel that action.</p>
<a id="demoLink" href="https://example.com/">Click this link (navigation will be prevented)</a><p id="result"></p>
<p>Open Developer Tools → Console to follow the output.</p>
<script>
const link=document.querySelector("#demoLink");
link.addEventListener("click",function(event){
  event.preventDefault();
  document.querySelector("#result").textContent="Navigation was cancelled. The link's normal action did not happen.";
  console.log("preventDefault() cancelled navigation to:",link.href);
});
console.log("Click the link. preventDefault affects the browser's default action; it does not stop the event from bubbling.");
</script>
<p><a href="1_event_handling.html">← Event handling topics</a></p>
</body></html>
