<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event propagation</title>
    <style>
        body {
            font: 16px/1.5 system-ui, sans-serif;
            max-width: 760px;
            margin: 2rem auto;
            padding: 0 1rem
        }

        button,
        input {
            font: inherit;
            padding: .45rem .7rem;
            margin: .25rem
        }

        pre {
            padding: .75rem;
            background: #f4f4f4;
            white-space: pre-wrap
        }

        #grandparent,
        #parent {
            border: 2px solid #527;
            padding: 1rem;
            margin: .5rem
        }
    </style>
</head>

<body>
    <h1>Event propagation</h1>
    <p>An event travels through the page. Capturing travels down toward the clicked element; bubbling travels back up
        through its parents.</p>
    <div id="grandparent">Grandparent<div id="parent">Parent <button id="child">Click the child</button></div>
    </div>
    <p>Open Developer Tools → Console to follow the output.</p>
    <script>
        const grandparent = document.querySelector("#grandparent");
        const parent = document.querySelector("#parent");
        const child = document.querySelector("#child");
        function show(event) { console.log(event.currentTarget.id + " listener; event target is " + event.target.id) }
        grandparent.addEventListener("click", show, true); // capture phase
        parent.addEventListener("click", show);             // bubble phase
        child.addEventListener("click", show);
        console.log("Click the button and read the order: grandparent capture, child, then parent bubble.");
    </script>
    <p><a href="1_event_handling.html">← Event handling topics</a></p>
</body>

</html>
