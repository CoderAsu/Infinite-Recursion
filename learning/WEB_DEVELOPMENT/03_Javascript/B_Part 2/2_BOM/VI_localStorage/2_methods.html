<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localStorage methods</title>
</head>

<body>
    <h1>localStorage methods</h1>
    <p>We save one lesson example, read it, then remove that same key. Other saved data is untouched.</p>
    <p>Open Developer Tools → Console to follow the example output.</p>
    <script>
        console.group("localStorage methods"); try { const savedData = window.localStorage, key = "bom-local-storage-example", value = "My sample note"; console.log("Methods:", { key: savedData.key, getItem: savedData.getItem, setItem: savedData.setItem, removeItem: savedData.removeItem, clear: savedData.clear }); savedData.setItem(key, value); console.log("setItem saves text:", key, "→", value); console.log("getItem reads it:", savedData.getItem(key)); console.log("key(0):", savedData.key(0)); savedData.removeItem(key); console.log("Example key removed. clear() deletes every key for this website, so it was not called.") } catch (error) { console.log("Storage unavailable:", error.message) } console.groupEnd();
    </script>
</body>

</html>
