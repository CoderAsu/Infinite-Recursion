<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-grow</title>
    <style>
        .container{
            background-color: beige;
            width: 600px;
            margin: 50px auto 0;
            padding: 10px;
            border: 3px solid #000;

            display: flex;
            flex-direction: row;
        }

        .one{background-color: orangered; flex-grow: 4;}
        .two{background-color: yellowgreen; flex-grow: 2;}
        .three{background-color: mediumpurple; flex-grow: 1;}
        .four{background-color: hotpink;}

        .items{
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="one items">One</div>
        <div class="two items">Two</div>
        <div class="three items">Three</div>
        <div class="four items">Four</div>
    </div>

    <!-- flex-grow will not work if we add flex-basis -->
</body>
</html>
