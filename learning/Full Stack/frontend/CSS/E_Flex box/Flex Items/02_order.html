<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>order</title>
    <style>
        .container{
            background-color: beige;
            width: 600px;
            margin: 50px auto 0;
            padding: 10px;
            border: 3px solid #000;

            display: flex;
            flex-direction: row;
        }

        .one{background-color: orangered; order: 1; }
        .two{background-color: yellowgreen; order: 0;}
        .three{background-color: mediumpurple; order: -1;}
        .four{background-color: hotpink; order: -2;}

        .items{
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            margin: 5px;
        }

        /* order property takes integer values like -1, 0, 1, 2, etc.
        The default value is 0. */
        
    </style>
</head>
<body>
    <div class="container">
        <div class="one items">One</div>
        <div class="two items">Two</div>
        <div class="three items">Three</div>
        <div class="four items">Four</div>
    </div>
</body>
</html>
