<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-basis</title>
    <style>
        .container{
            background-color: beige;
            width: 700px;
            margin: 50px auto 0;
            padding: 10px;
            border: 3px solid #000;

            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .items{
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
        }

        .one{background-color: orangered; flex-basis: 200px;}
        .two{background-color: yellowgreen;}
        .three{background-color: mediumpurple;}
        .four{background-color: hotpink; flex-basis: 300px;}

        /* flex-basis is based on max-width. */

    </style>
</head>
<body>
    <!-- flex-basis works like max-width -->
    <div class="container">
        <div class="one items">One</div>
        <div class="two items">Two</div>
        <div class="three items">Three</div>
        <div class="four items">Four</div>
    </div>
</body>
</html>
