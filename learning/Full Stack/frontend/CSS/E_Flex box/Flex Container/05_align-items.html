<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>align-items</title>
    <style>
        .container{
            background-color: beige;
            width: 600px;
            height: 400px;
            margin: 50px auto 0;
            padding: 10px;
            border: 3px solid #000;

            display: flex;
            align-items: center;
        }

        .one{background-color: orangered;}
        .two{background-color: yellowgreen; height: 100px; font-size: 35px;}
        .three{background-color: mediumpurple;}
        .four{background-color: hotpink; font-size: 11px;}

        .items{
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <!-- Values of align-items -->
     <!-- 
        1. flex-start
        2. flex-end
        3. center
        4. stretch (default)
        5. baseline
     -->

    <!-- By changing the flex-items into column the behaviour of justify-content and align-items also changed. -->

    <div class="container">
        <div class="one items">One</div>
        <div class="two items">Two</div>
        <div class="three items">Three</div>
        <div class="four items">Four</div>
    </div>

    <!--    
        -> justify-content(horizontal) and align-items(vertical) 
        -> align-content works after we wrap the columns or rows 
    -->
</body>
</html>
