<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-wrap and flex-flow</title>
    <style>
        .container{
            background-color: beige;
            width: 600px;
            margin: 50px auto 0;
            padding: 10px;
            border: 3px solid #000;
            width: 300px;
            height: 200px;
            

            display: flex;
            /*flex-wrap: wrap;
            flex-direction: column;*/

            flex-flow: column wrap;
        }

        .one{background-color: orangered;}
        .two{background-color: yellowgreen;}
        .three{background-color: mediumpurple;}
        .four{background-color: hotpink;}
        .five{background-color: crimson;}
        .six{background-color: rgb(50, 188, 235);}
        .seven{background-color: rgb(24, 236, 24);}
        .eight{background-color: lightseagreen;}

        .items{
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <!-- Values of flex-wrap -->
     <!-- 
        1. nowrap (default)
        2. wrap
        3. wrap-reverse
     -->

    <!-- flex-flow is the mixture of flex-direction and flex-wrap -->

    <div class="container">
        <div class="one items">One</div>
        <div class="two items">Two</div>
        <div class="three items">Three</div>
        <div class="four items">Four</div>
        <div class="five items">Five</div>
        <div class="six items">Six</div>
        <div class="seven items">Seven</div>
        <div class="eight items">Eight</div>
    </div>
</body>
</html>
