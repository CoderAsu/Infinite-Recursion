<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-direction</title>
    <style>
        .container{
            background-color: beige;
            width: 600px;
            margin: 50px auto 0;
            padding: 10px;
            border: 3px solid #000;

            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .one{background-color: orangered;}
        .two{background-color: yellowgreen;}
        .three{background-color: mediumpurple;}
        .four{background-color: hotpink;}

        .items{
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
        }

        /* flex-direction has four properties:
            1. row
            2. column
            3. row-reverse
            4. column-reverse  
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="one items">One</div>
        <div class="two items">Two</div>
        <div class="three items">Three</div>
        <div class="four items">Four</div>
    </div>
</body>
</html>
