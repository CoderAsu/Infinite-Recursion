<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::before and ::after</title>
    <style>

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div{
            font-size: 30px;
        }

        div::before{
            content: 'Hello';
            font-size: 50px;
        }
        
        div::after{
            content: "World!";
            font-size: 40px;
        }
    </style>
</head>
<body>
    <div>😀</div>
</body>
</html>
