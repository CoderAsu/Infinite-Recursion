<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:empty</title>
    <style>
        div:empty{
            height: 200px;
            aspect-ratio: 1;
            border: 2px solid black;
            border-radius: 5px;
            background-color: aquamarine;
        }

        /* :empty targets the container tag whose content is empty, if there is a space between the tags it does not target.*/
    </style>
</head>
<body>
    <div></div>
    <br>
    <div> </div>
    <br>
    <div>hello</div>
</body>
</html>
