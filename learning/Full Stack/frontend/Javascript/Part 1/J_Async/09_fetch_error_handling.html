<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reliable fetch requests</title>
</head>

<body>
  <h1>Reliable fetch requests</h1>
  <p>fetch() rejects for network failures, but an HTTP error such as 404 still returns a Response. Check response.ok
    yourself.</p>
  <button id="loadButton">Load example post</button>
  <button id="cancelButton" disabled>Cancel request</button>
  <p id="status">Press Load to make a request.</p>
  <pre id="result"></pre>
  <p>Open Developer Tools → Console for request details.</p>
  <script>
    const loadButton = document.querySelector("#loadButton");
    const cancelButton = document.querySelector("#cancelButton");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    let controller;

    loadButton.addEventListener("click", async () => {
      controller = new AbortController();
      loadButton.disabled = true;
      cancelButton.disabled = false;
      status.textContent = "Loading…";
      result.textContent = "";

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts/1", {
          signal: controller.signal
        });
        console.log("HTTP status:", response.status);
        if (!response.ok) throw new Error(`Request failed with HTTP status ${response.status}`);

        const post = await response.json();
        status.textContent = "Loaded successfully.";
        result.textContent = JSON.stringify(post, null, 2);
        console.log("Parsed JSON:", post);
      } catch (error) {
        if (error.name === "AbortError") status.textContent = "Request cancelled.";
        else {
          status.textContent = "Could not load the post: " + error.message;
          console.error("Fetch error:", error);
        }
      } finally {
        loadButton.disabled = false;
        cancelButton.disabled = true;
        controller = undefined;
        console.log("Request finished; finally always runs.");
      }
    });

    cancelButton.addEventListener("click", () => controller?.abort());
  </script>
</body>

</html>
