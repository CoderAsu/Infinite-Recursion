<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <input type="text" placeholder="Enter City">
    <button id="search-button">Search</button>

    <div>
        <h3 id="city-name"></h3>
        <h6 id="city-time"></h6>
        <p id="city-temp"></p>
    </div>
</body>
    <script>
    
    const button = document.getElementById("search-button");
    const input = document.querySelector("input[type='text']");

    const cityName = document.getElementById("city-name");
    const cityTime = document.getElementById("city-time");
    const cityTemp = document.getElementById("city-temp");

    async function getData(location){
        const response = await fetch(`https://api.weatherapi.com/v1/current.json?key=49af0bb8edf0454b810124913252204&q=${location}&aqi=yes`);
        return await response.json();
    }

    button.addEventListener("click", async () => {
        const value = input.value;
        const result = await getData(value);
        cityName.innerText = `${result.location.country}, ${result.location.region} - ${result.location.name}`;
        cityTime.innerText = result.location.localtime;
        cityTemp.innerText = result.current.temp_c;
        console.log(result.location.country, result.location.region, result.location.name);
        console.log(result);
    });


</script>
</html>
