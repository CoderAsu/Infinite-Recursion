    function getData(dataId){
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                console.log("data:", dataId);
                resolve("success");
            }, 2000);
        });
    }



    // Promise Chain
    console.log("Fetching Data...");
    console.log("getting data1...");
    getData(1)
    .then((res) => {
        console.log("getting data2...");
        console.log(res);
        return getData(2);
    })
    .then((res) => {
