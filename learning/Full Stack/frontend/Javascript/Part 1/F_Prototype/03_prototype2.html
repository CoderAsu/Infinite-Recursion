<!DOCTYPE html>
<html lang="en">

    <title>prototype 2</title>

</body>
<script>
    let myName = new String();
    console.log(myName);
    
    let myHeroes = ["thor", "spiderman"];

    let heroPower = {
        thor: "hammer",
        spiderman: "sling",
        getSpidyPower: function() {
            console.log(`Spidy power is ${this.spiderman}`);
            
        }
    }


    Object.prototype.asu = function() {
        console.log("Asu is present in all Object");
        
    }

    heroPower.asu();
    myHeroes.asu();
    myName.asu();


    console.log(heroPower);
    console.log(myHeroes);
    console.log(myName);

    Array.prototype.heyAsu = function() {
        console.log(`Asu says hello`);
    }

    myHeroes.heyAsu();
    // heroPower.heyAsu();
    // myName.heyAsu();
</script>
</html>
