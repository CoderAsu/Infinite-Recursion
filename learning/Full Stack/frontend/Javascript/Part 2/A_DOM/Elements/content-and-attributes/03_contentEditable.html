<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contenteditable</title>
    <style>
        #container{
            height: 300px;
            width: 400px;
            border: 2px solid black;
            background-color: hotpink;
        }

        #container2{
            height: 300px;
            width: 400px;
            border: 2px solid black;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <br><br>
    <div id="container2"></div>
</body>
<script>
    let element1 = document.getElementById("container");
    let element2 = document.getElementById("container2");

    element1.contentEditable = "true";

    console.log(element1.isContentEditable);
    console.log(element2.isContentEditable);
</script>
</html>
