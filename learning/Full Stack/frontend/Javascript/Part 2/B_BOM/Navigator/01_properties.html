<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Navigator properties</title></head>
<body><h1>Navigator properties</h1><p>Navigator reports browser and device information. Values vary by browser and some are limited for privacy.</p><p>Open Developer Tools → Console to follow the example output.</p><script>
const browserInfo=navigator;
console.group("Navigator properties"); console.table({language:browserInfo.language,languages:browserInfo.languages.join(", "),online:browserInfo.onLine,cookiesEnabled:browserInfo.cookieEnabled,userAgent:browserInfo.userAgent,logicalCpuCount:browserInfo.hardwareConcurrency,touchPoints:browserInfo.maxTouchPoints,geolocationAvailable:"geolocation" in browserInfo,clipboardAvailable:"clipboard" in browserInfo,mediaDevicesAvailable:"mediaDevices" in browserInfo,permissionsAvailable:"permissions" in browserInfo,serviceWorkerAvailable:"serviceWorker" in browserInfo,storageAvailable:"storage" in browserInfo}); console.groupEnd();
</script></body></html>
