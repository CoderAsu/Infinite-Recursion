<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console methods</title>
</head>
<body>
    
</body>
<script>


/*
    console.log()	Prints general information

    console.info()	Prints informational messages

    console.warn()	Displays a warning

    console.error()	Displays an error message

    console.debug()	Displays a debugging message
    
    console.clear()	Clears the console display
*/

    console.log("Hello JavaScript");
    console.info("Application started");
    console.warn("This is a warning");
    console.error("Something went wrong");
    console.debug("Debugging information");

</script>
</html>
